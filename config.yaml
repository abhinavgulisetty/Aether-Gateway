# All services run locally; start upstreams with ./scripts/demo.sh start.
listen: "127.0.0.1:3000"
auth:
  enabled: true
  api_keys: ["local-demo-key"]
rate_limit:
  enabled: true
  max_tokens: 100
  refill_rate: 50
  max_clients: 4096
  idle_seconds: 60
limits:
  max_in_flight: 256
  max_body_bytes: 16777216
  pool_max_idle_per_host: 32
  pool_idle_seconds: 30
  shutdown_seconds: 10
health:
  path: /health
  interval_ms: 500
  timeout_ms: 200
resilience:
  connect_timeout_ms: 300
  response_timeout_ms: 700
  request_timeout_ms: 5000
  max_attempts: 2
  retry_backoff_ms: 20
  failure_threshold: 3
  cooldown_ms: 2000
routes:
  - path_prefix: /api
    strip_prefix: true
    policy: least_active
    upstreams: ["http://127.0.0.1:9101", "http://127.0.0.1:9102", "http://127.0.0.1:9103"]
  - path_prefix: /
    policy: round_robin
    upstreams: ["http://127.0.0.1:9101", "http://127.0.0.1:9102", "http://127.0.0.1:9103"]
