worker_processes auto;
events { worker_connections 4096; }

http {
  access_log off;
  upstream backend {
    server 127.0.0.1:9101;
    keepalive 32;
  }
  server {
    listen 127.0.0.1:3001;
    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://backend;
    }
  }
}
